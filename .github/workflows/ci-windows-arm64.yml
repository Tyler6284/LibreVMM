# =============================================================================
# CI Pipeline for Windows ARM64
# =============================================================================
# Builds LibreVMM for Windows ARM64 (cross-compiled from x86_64)
# =============================================================================

name: Windows ARM64

on:
  push:
    branches: [main, develop]
    paths:
      - '**.c'
      - '**.cpp'
      - '**.h'
      - '**.cmake'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      BUILD_PROFILE: desktop-full

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout submodules
        uses: actions/checkout@v4
        with:
          repository: librevmm/vendors
          path: vendor
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Install LLVM for Windows ARM64 cross-compilation
        run: |
          # Install LLVM which includes arm64-windows target
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          rm llvm.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            meson \
            python3 \
            python3-jinja2 \
            git \
            wget \
            xz-utils \
            mingw-w64

      - name: Configure (Cross-compile)
        run: |
          cmake -B build-win-arm64 \
            -G Ninja \
            -DBUILD_PROFILE=${{ env.BUILD_PROFILE }} \
            -DCMAKE_TOOLCHAIN_FILE=cmake/Toolchain-mingw64-arm64.cmake

      - name: Build (Cross-compile)
        run: |
          cmake --build build-win-arm64 -j$(nproc)

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-arm64-artifacts
          path: |
            build-win-arm64/**/*.exe
            build-win-arm64/**/*.dll
            build-win-arm64/**/*.lib
          retention-days: 7

  minimal-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          rm llvm.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            meson \
            python3

      - name: Configure (Minimal)
        run: |
          cmake -B build-win-arm64 \
            -G Ninja \
            -DBUILD_PROFILE=minimal \
            -DCMAKE_TOOLCHAIN_FILE=cmake/Toolchain-mingw64-arm64.cmake

      - name: Build (Minimal)
        run: |
          cmake --build build-win-arm64 -j$(nproc)

  build-matrix:
    needs: [build, minimal-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "- Windows ARM64 (full): ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Windows ARM64 (minimal): ${{ needs.minimal-build.result }}" >> $GITHUB_STEP_SUMMARY

# Will not work for Windows driver compilation for ARM64, must use appropriate Windows DDK with Visual Studio!