# =============================================================================
# CI Pipeline for Linux x86_64
# =============================================================================
# Builds LibreVMM on Linux x86_64
# =============================================================================

name: Linux x86_64

on:
  push:
    branches: [main, develop]
    paths:
      - '**.c'
      - '**.cpp'
      - '**.h'
      - '**.cmake'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      BUILD_PROFILE: desktop-full

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout submodules
        uses: actions/checkout@v4
        with:
          repository: librevmm/vendors
          path: vendor
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            meson \
            python3 \
            python3-jinja2 \
            git \
            wget \
            xz-utils \
            libssl-dev \
            libpulse-dev \
            libasound2-dev \
            libgtk-3-dev \
            libqt5opengl5-dev \
            libxkbcommon-dev \
            libdbus-1-dev \
            libsdl2-dev \
            pkg-config

      - name: Configure
        run: |
          cmake -B build -G Ninja -DBUILD_PROFILE=${{ env.BUILD_PROFILE }}

      - name: Build
        run: |
          cmake --build build -j$(nproc)

      - name: Run Tests
        run: |
          ctest --test-dir build --output-on-failure || true
        continue-on-error: true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-artifacts
          path: |
            build/**/*.so*
            build/**/*.a
            build/**/*.exe
          retention-days: 7

  minimal-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            meson \
            python3

      - name: Configure (Minimal)
        run: |
          cmake -B build -G Ninja -DBUILD_PROFILE=minimal

      - name: Build (Minimal)
        run: |
          cmake --build build -j$(nproc)

  headless-build:
    runs-on: ubuntu-22.04

    env:
      BUILD_PROFILE: headless-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            meson \
            python3

      - name: Configure (Headless)
        run: |
          cmake -B build -G Ninja -DBUILD_PROFILE=headless-server

      - name: Build (Headless)
        run: |
          cmake --build build -j$(nproc)

  build-matrix:
    needs: [build, minimal-build, headless-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "- Linux x86_64 (full): ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Linux x86_64 (minimal): ${{ needs.minimal-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Linux x86_64 (headless): ${{ needs.headless-build.result }}" >> $GITHUB_STEP_SUMMARY
