# =============================================================================
# CI Pipeline for Linux ARM64
# =============================================================================
# Builds LibreVMM on Linux ARM64 (native or cross-compiled)
# =============================================================================

name: Linux ARM64

on:
  push:
    branches: [main, develop]
    paths:
      - '**.c'
      - '**.cpp'
      - '**.h'
      - '**.cmake'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Native ARM64 build
  build-native:
    runs-on: ubuntu-24.04-arm64

    env:
      BUILD_PROFILE: desktop-full

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout submodules
        uses: actions/checkout@v4
        with:
          repository: librevmm/vendors
          path: vendor
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            meson \
            python3 \
            python3-jinja2 \
            git \
            wget \
            xz-utils \
            libssl-dev \
            libpulse-dev \
            libasound2-dev \
            libsdl2-dev \
            pkg-config

      - name: Configure
        run: |
          cmake -B build -G Ninja -DBUILD_PROFILE=${{ env.BUILD_PROFILE }}

      - name: Build
        run: |
          cmake --build build -j$(nproc)

      - name: Run Tests
        run: |
          ctest --test-dir build --output-on-failure || true
        continue-on-error: true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-artifacts
          path: |
            build/**/*.so*
            build/**/*.a
          retention-days: 7

  # Cross-compiled ARM64 build (on x86_64)
  build-cross:
    runs-on: ubuntu-22.04

    env:
      BUILD_PROFILE: desktop-full

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout submodules
        uses: actions/checkout@v4
        with:
          repository: librevmm/vendors
          path: vendor
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            meson \
            python3 \
            python3-jinja2 \
            git \
            wget \
            xz-utils \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            pkg-config-aarch64-linux-gnu \
            qemu-user

      - name: Configure (Cross-compile)
        run: |
          cmake -B build \
            -G Ninja \
            -DBUILD_PROFILE=${{ env.BUILD_PROFILE }} \
            -DCMAKE_TOOLCHAIN_FILE=cmake/Toolchain-linux-aarch64.cmake

      - name: Build (Cross-compile)
        run: |
          cmake --build build -j$(nproc)

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-cross-artifacts
          path: |
            build/**/*.so*
            build/**/*.a
          retention-days: 7

  minimal-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            meson \
            python3 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Configure (Minimal)
        run: |
          cmake -B build \
            -G Ninja \
            -DBUILD_PROFILE=minimal \
            -DCMAKE_TOOLCHAIN_FILE=cmake/Toolchain-linux-aarch64.cmake

      - name: Build (Minimal)
        run: |
          cmake --build build -j$(nproc)

  build-matrix:
    needs: [build-native, build-cross, minimal-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "- Linux ARM64 (native): ${{ needs.build-native.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Linux ARM64 (cross): ${{ needs.build-cross.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Linux ARM64 (minimal): ${{ needs.minimal-build.result }}" >> $GITHUB_STEP_SUMMARY
